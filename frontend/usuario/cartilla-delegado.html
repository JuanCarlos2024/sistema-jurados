<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informe del Delegado Oficial — Sistema de Jurados</title>
    <link rel="icon" type="image/png" href="/assets/logo_V2.png">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .cartilla-form { max-width: 820px; margin: 0 auto; }
        .bloque { background:#fff; border:1px solid #ddd; border-radius:10px; margin-bottom:16px; overflow:hidden; }
        .bloque-header { background:#1a3c6e; color:#fff; padding:11px 18px; font-size:13px; font-weight:700; letter-spacing:.3px; display:flex; justify-content:space-between; align-items:center; }
        .bloque-header .badge-pendiente { font-size:10px; font-weight:600; background:rgba(255,255,255,.2); padding:2px 8px; border-radius:10px; }
        .bloque-body { padding:18px; }
        .campo-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
        @media(max-width:580px){ .campo-grid { grid-template-columns:1fr; } }
        .form-label { font-size:12px; font-weight:600; color:#555; margin-bottom:4px; display:block; }
        .req { color:#e74c3c; }
        .form-control { width:100%; padding:8px 10px; border:1px solid #ccc; border-radius:6px; font-size:14px; box-sizing:border-box; background:#fff; }
        .form-control:focus { outline:none; border-color:#1a3c6e; box-shadow:0 0 0 2px #d5e6ff; }
        .form-control[readonly], .form-control:disabled { background:#f5f5f5; color:#555; cursor:default; }
        .radio-grupo { display:flex; gap:16px; align-items:center; margin-top:4px; }
        .radio-grupo label { display:flex; align-items:center; gap:6px; font-size:14px; cursor:pointer; }
        .checkbox-grupo { display:flex; flex-direction:column; gap:10px; }
        .checkbox-item { display:flex; align-items:flex-start; gap:10px; }
        .checkbox-item input[type=checkbox] { margin-top:3px; width:16px; height:16px; cursor:pointer; flex-shrink:0; }
        .checkbox-item label { font-size:14px; cursor:pointer; line-height:1.4; }
        .barra-acciones { position:sticky; bottom:0; background:#fff; border-top:1px solid #ddd; padding:12px 18px; display:flex; gap:10px; justify-content:flex-end; z-index:100; box-shadow:0 -2px 8px rgba(0,0,0,.07); }
        .estado-badge { display:inline-block; padding:4px 12px; border-radius:20px; font-size:12px; font-weight:700; }
        .estado-borrador { background:#fff3cd; color:#856404; border:1px solid #ffc107; }
        .estado-enviada  { background:#d1f2eb; color:#145a32; border:1px solid #27ae60; }
        .enviada-notice  { background:#d1f2eb; border:1px solid #27ae60; border-radius:8px; padding:14px 18px; margin-bottom:16px; font-size:14px; color:#145a32; }
        .enviada-notice strong { display:block; font-size:15px; margin-bottom:4px; }
        .rodeo-info-card { background:#eaf4fb; border:1px solid #aed6f1; border-radius:8px; padding:14px 18px; margin-bottom:16px; }
        .rodeo-info-card .titulo { font-weight:700; font-size:16px; color:#1a3c6e; margin-bottom:6px; }
        .rodeo-info-card .meta   { font-size:13px; color:#555; display:flex; flex-wrap:wrap; gap:10px; }
        .rodeo-info-card .meta span { background:#fff; border:1px solid #d6eaf8; border-radius:4px; padding:2px 8px; }
        .bloque-futuro { opacity:.6; }
        .bloque-futuro .bloque-body { display:flex; align-items:center; gap:10px; padding:14px 18px; font-size:13px; color:#777; font-style:italic; }
        #alerta-global { margin-bottom:14px; }
        .spinner-wrap { text-align:center; padding:40px; }

        /* ── Tablas de ganado (ETAPA 2) ────────────────────────────────────── */
        .sub-titulo-ganado { font-size:12px; font-weight:700; color:#1a3c6e; text-transform:uppercase; letter-spacing:.4px; margin-bottom:10px; padding-bottom:6px; border-bottom:2px solid #e0e8f5; }
        .tabla-wrap-ganado { overflow-x:auto; margin-bottom:18px; }
        .tbl-ganado { border-collapse:collapse; font-size:12px; min-width:100%; }
        .tbl-ganado th { background:#1a3c6e; color:#fff; padding:6px 8px; text-align:center; font-size:11px; font-weight:700; border:1px solid #14316a; white-space:nowrap; }
        .tbl-ganado th.th-grupo { background:#2755a3; }
        .tbl-ganado th.th-serie { background:#0f2347; text-align:left; min-width:130px; }
        .tbl-ganado td { padding:3px 4px; border:1px solid #dde3ec; vertical-align:middle; background:#fff; }
        .tbl-ganado tr:nth-child(even) td { background:#f7f9fc; }
        .tbl-ganado td.td-serie { background:#eaf0f8; font-size:12px; }
        .tbl-ganado td.td-calc { background:#f0f7ec; text-align:center; font-weight:600; color:#1a6e2b; font-size:12px; padding:4px 8px; }
        .tbl-ganado td.td-total { background:#1a3c6e; color:#fff; font-weight:700; text-align:center; font-size:12px; padding:5px 8px; }
        .tbl-ganado td.td-total-calc { background:#14a348; color:#fff; font-weight:700; text-align:center; font-size:12px; padding:5px 8px; }
        .inp-ganado { width:100%; border:none; background:transparent; font-size:12px; padding:4px 6px; box-sizing:border-box; text-align:center; }
        .inp-ganado:focus { outline:2px solid #2755a3; border-radius:3px; background:#fff; }
        .inp-ganado[readonly], .inp-ganado:disabled { color:#555; cursor:default; background:transparent; }
        .inp-ganado-serie { text-align:left; }
        .sel-ganado { width:100%; border:none; background:transparent; font-size:12px; padding:3px 4px; box-sizing:border-box; }
        .sel-ganado:focus { outline:2px solid #2755a3; border-radius:3px; background:#fff; }
        .sel-ganado:disabled { color:#555; cursor:default; }
        .btn-quitar-serie { background:none; border:none; color:#c0392b; cursor:pointer; font-size:16px; padding:2px 6px; line-height:1; border-radius:4px; }
        .btn-quitar-serie:hover { background:#fdecea; }
        .btn-agregar-serie { margin-top:8px; font-size:12px; padding:5px 14px; }
        .aviso-ganado-bajo-peso { background:#fff8e1; border:1px solid #ffc107; border-radius:6px; padding:8px 12px; font-size:12px; color:#795800; margin-bottom:10px; display:none; }
        /* Serie unificada (Series + Ganado, 4ª revisión) — una Serie = un solo registro */
        .serie-card { border:1px solid #ddd; border-radius:8px; margin-bottom:16px; overflow:hidden; }
        .serie-card-header { background:#0f2347; color:#fff; padding:10px 14px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
        .serie-card-header label { font-size:12px; font-weight:600; }
        .serie-card-header select { padding:5px 8px; border-radius:4px; border:1px solid #ccc; font-size:13px; min-width:180px; }
        .serie-card-body { padding:14px; background:#fafcff; }
        .animales-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px,1fr)); gap:12px; margin-bottom:14px; }
        .animal-card { border:1px solid #e0e8f5; border-radius:6px; background:#fff; overflow:hidden; }
        .animal-card-header { background:#2755a3; color:#fff; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; padding:6px 10px; }
        .animal-card-body { padding:10px; display:flex; flex-direction:column; gap:7px; }
        .animal-field label { display:block; font-size:11px; font-weight:600; color:#555; margin-bottom:2px; }
        .animal-field input, .animal-field select { width:100%; padding:5px 7px; font-size:12px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box; }
        .animal-field input:disabled, .animal-field select:disabled { background:#f2f2f2; color:#555; }
        .serie-fuera-peso { border-top:2px solid #e0e8f5; padding-top:10px; margin-top:4px; }
        .serie-fuera-peso .campo-grid { margin-bottom:8px; }

        /* ── ETAPA 3 ─────────────────────────────────────────────────────────── */
        .sec-sub { font-size:12px; font-weight:700; color:#1a3c6e; text-transform:uppercase; letter-spacing:.3px; margin:14px 0 8px; padding-bottom:5px; border-bottom:1px solid #e0e8f5; }
        .link-externo { display:inline-flex; align-items:center; gap:6px; background:#eaf4fb; border:1px solid #aed6f1; border-radius:6px; padding:8px 14px; font-size:13px; color:#1a3c6e; text-decoration:none; font-weight:600; margin-bottom:12px; }
        .link-externo:hover { background:#d6eaf8; }
        .aviso-relacion { background:#fff8e1; border:1px solid #ffc107; border-radius:6px; padding:8px 12px; font-size:12px; color:#795800; margin-bottom:10px; }
        /* situaciones disciplinarias */
        .sit-card { border:1px solid #dde3ec; border-radius:8px; margin-bottom:10px; overflow:hidden; }
        .sit-card-hdr { background:#f0f4fb; border-bottom:1px solid #dde3ec; padding:7px 14px; display:flex; justify-content:space-between; align-items:center; font-size:12px; font-weight:700; color:#1a3c6e; }
        .sit-card-body { padding:12px 14px; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        @media(max-width:580px){ .sit-card-body { grid-template-columns:1fr; } }
        .sit-card-full { grid-column:1/-1; }
        /* aspectos recinto */
        .aspectos-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
        @media(max-width:600px){ .aspectos-grid { grid-template-columns:1fr; } }
        .aspecto-card { border:1px solid #e0e8f5; border-radius:6px; padding:10px 12px; background:#fafcff; }
        .aspecto-label { font-size:12px; font-weight:700; color:#333; margin-bottom:6px; display:block; }
        .sel-estado { width:100%; padding:5px 8px; border:1px solid #ccc; border-radius:5px; font-size:13px; background:#fff; box-sizing:border-box; }
        .sel-estado:focus { outline:none; border-color:#1a3c6e; }
        .sel-estado:disabled { background:#f5f5f5; color:#555; }
        .inp-obs-asp { width:100%; padding:4px 7px; border:1px solid #e0e0e0; border-radius:4px; font-size:12px; margin-top:5px; box-sizing:border-box; }
        .inp-obs-asp:disabled, .inp-obs-asp[readonly] { background:#f5f5f5; color:#555; }
        /* tablas dinámicas coleras/reemplazos */
        .tbl-din { border-collapse:collapse; width:100%; font-size:13px; }
        .tbl-din th { background:#2755a3; color:#fff; padding:7px 10px; font-size:12px; font-weight:700; white-space:nowrap; text-align:left; }
        .tbl-din td { border:1px solid #e0e8f5; padding:4px 6px; vertical-align:middle; }
        .tbl-din tr:nth-child(even) td { background:#f7f9fc; }
        .inp-din { width:100%; border:none; background:transparent; font-size:13px; padding:3px 5px; box-sizing:border-box; min-width:80px; }
        .inp-din:focus { outline:2px solid #2755a3; border-radius:3px; background:#fff; }
        .inp-din:disabled { color:#555; cursor:default; }
        .sel-din { width:100%; border:none; background:transparent; font-size:12px; padding:3px 4px; }
        .sel-din:focus { outline:2px solid #2755a3; border-radius:3px; background:#fff; }
        .sel-din:disabled { color:#555; }
        .btn-q { background:none; border:none; color:#c0392b; cursor:pointer; font-size:16px; padding:2px 6px; border-radius:4px; }
        .btn-q:hover { background:#fdecea; }
        .campo-form-sm label { font-size:12px; font-weight:600; color:#555; display:block; margin-bottom:3px; }
        .campo-form-sm input, .campo-form-sm select, .campo-form-sm textarea { width:100%; padding:6px 9px; border:1px solid #ccc; border-radius:5px; font-size:13px; box-sizing:border-box; }
        .campo-form-sm input:disabled, .campo-form-sm select:disabled, .campo-form-sm textarea:disabled,
        .campo-form-sm input[readonly], .campo-form-sm textarea[readonly] { background:#f5f5f5; color:#555; }

        /* ── ETAPA 5 — estados y banners ─────────────────────────────────────── */
        .estado-observada { background:#fdebd0; color:#784212; border:1px solid #e67e22; }
        .estado-reenviada { background:#d5f5e3; color:#1e8449; border:1px solid #52be80; }
        .estado-aprobada  { background:#d6eaf8; color:#1a5276; border:1px solid #2e86c1; }
        .observada-banner { background:#fef9e7; border:1px solid #f39c12; border-radius:8px; padding:14px 18px; margin-bottom:16px; }
        .observada-banner strong { display:block; font-size:15px; color:#784212; margin-bottom:6px; }
        .observada-banner .motivo-obs { background:#fff; border:1px solid #f39c12; border-radius:5px; padding:8px 12px; font-size:13px; color:#333; margin-top:6px; white-space:pre-wrap; }
        .aprobada-notice  { background:#d6eaf8; border:1px solid #2e86c1; border-radius:8px; padding:14px 18px; margin-bottom:16px; }
        .aprobada-notice strong { display:block; font-size:15px; color:#1a5276; margin-bottom:4px; }
        .plazo-vencido { background:#fdecea; border:1px solid #e74c3c; border-radius:8px; padding:10px 14px; margin-bottom:12px; font-size:13px; color:#c0392b; font-weight:600; }
        .plazo-proximo { background:#fff8e1; border:1px solid #ffc107; border-radius:8px; padding:10px 14px; margin-bottom:12px; font-size:13px; color:#795800; }
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            <img src="/assets/logo_V2.png" alt="Federación del Rodeo Chileno" style="width:72px; height:72px; object-fit:contain; margin-bottom:6px;">
            <h2>Sistema de Jurados</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="/usuario/dashboard.html" class="nav-item"><span class="icon">🏠</span> Mi Panel</a>
            <a href="/usuario/resumen.html"   class="nav-item"><span class="icon">💵</span> Mis Pagos</a>
            <a href="/usuario/perfil.html"    class="nav-item"><span class="icon">👤</span> Mi Perfil</a>
            <a href="/usuario/capacitaciones.html" class="nav-item"><span class="icon">🎓</span> Mis Capacitaciones</a>
            <a href="/usuario/material-complementario.html" class="nav-item"><span class="icon">📂</span> Material complementario</a>
        </nav>
        <div class="sidebar-footer">
            <div class="sidebar-usuario" id="nombre-usr"></div>
            <button class="btn btn-secundario btn-pequeño w-100" onclick="api.cerrarSesion()">Cerrar Sesión</button>
        </div>
    </aside>

    <div class="main-content">
        <div class="topbar">
            <div class="flex items-center gap-12">
                <button class="btn-menu-movil" onclick="document.getElementById('sidebar').classList.toggle('abierto')">☰</button>
                <h1>Informe del Delegado Oficial del Rodeo</h1>
            </div>
            <a href="/usuario/dashboard.html" class="btn btn-secundario btn-pequeño">← Mi Panel</a>
        </div>

        <div class="page-body">
            <div class="cartilla-form">
                <div id="alerta-global"></div>
                <div id="cuerpo-cartilla">
                    <div class="spinner-wrap"><div class="spinner"></div></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/utils.js"></script>
<script>
protegerRuta('usuario_pagado');

const _usr = api.getUsuario();
if (_usr?.tipo_persona !== 'delegado_rentado') {
    window.location.href = '/usuario/dashboard.html';
}
document.getElementById('nombre-usr').textContent = _usr?.nombre || '';

const params   = new URLSearchParams(location.search);
const RODEO_ID = params.get('rodeo_id');

// ── Globals ETAPA 1 ──────────────────────────────────────────────────────────
let _cartillaId    = null;
let _estado        = null;
let _guardando     = false;
let _jurados       = []; // Jurado(s) real(es) asignados al rodeo — SOLO LECTURA (nuevo formato 2026-2027)
let _rodeoActual    = null; // rodeo cargado — fuente EN VIVO de Temporada/Tipo de Rodeo/Asociación/Club (4ª revisión)

// ── Globals ETAPA 2 ──────────────────────────────────────────────────────────
let _seriesGanado   = [];
let _respuestasJson = {};

// ── Globals ETAPA 3 ──────────────────────────────────────────────────────────
let _dj      = {};  // desempeño jurado
let _disc    = {};  // disciplina
let _recinto = {};  // recinto deportivo
let _col     = {};  // colleras invitadas
let _ree     = {};  // reemplazo jinetes
// Informe general de accidentes (bloque breve, dentro de la Sección I
// unificada, documento oficial 2026-2027): TEXTO LIBRE independiente del
// detalle estructurado de "VI. Reporte de accidentes" (`_acc`). Comparte
// solo el Sí/No `_acc.hubo_accidentes` (misma pregunta), pero el relato
// es propio.
let _accGeneral = '';

// ── Globals ETAPA 4 ──────────────────────────────────────────────────────────
let _acc  = {};  // accidentes
let _ba   = {};  // bienestar animal
let _vet  = {};  // veterinario
let _recs = {};  // reclamos/sugerencias
let _com  = {};  // Anexo 03 — comentarios generales (nuevo formato 2026-2027)
let _ant  = {};  // Anexo 04 — antecedentes disciplinarios complementarios (nuevo formato 2026-2027)

if (!RODEO_ID) {
    document.getElementById('cuerpo-cartilla').innerHTML =
        '<div class="alerta alerta-error">Falta el parámetro rodeo_id en la URL.</div>';
} else {
    init();
}

async function init() {
    try {
        const r = await api.get(`/usuario/cartilla-delegado/rodeo/${RODEO_ID}`);
        renderCartilla(r);
    } catch (err) {
        document.getElementById('cuerpo-cartilla').innerHTML =
            `<div class="alerta alerta-error">${sanitizar(err.message || 'Error al cargar la cartilla')}</div>`;
    }
}

// ═════════════════════════════════════════════════════════════════════════════
// RENDER PRINCIPAL
// ═════════════════════════════════════════════════════════════════════════════
function renderCartilla(r) {
    const { rodeo, perfil, cartilla, jurados } = r;
    _jurados = Array.isArray(jurados) ? jurados : [];
    _rodeoActual = rodeo || null;
    _estado     = cartilla ? cartilla.estado : 'nueva';
    _cartillaId = cartilla ? cartilla.id     : null;
    const ya    = ['enviada', 'reenviada', 'aprobada'].includes(_estado);

    _respuestasJson = cartilla?.respuestas_json || {};
    _seriesGanado   = Array.isArray(_respuestasJson.ganado_series)
        ? _respuestasJson.ganado_series.map(s => ({ ...s }))
        : [];
    // `_vet` se inicializa acá (además de en _initSecciones4, misma fuente)
    // para que el encabezado (Sección I) pueda mostrar el nombre/teléfono/
    // correo del veterinario apenas se pinta la cartilla, sin esperar a que
    // se rendericen las secciones dinámicas más abajo.
    _vet = Object.assign({
        nombre: '', telefono: '', correo: '',
        preparacion: '', especifica_tecnico: '', especifica_otro: '',
        sombra_ganado: null, sombra_ganado_obs: '',
        sombra_equinos: null, sombra_equinos_obs: '',
        agua_ganado: null, agua_ganado_obs: '',
        agua_equinos: null, agua_equinos_obs: '',
        comida_ganado: null, comida_ganado_obs: '',
        comida_equinos: null, comida_equinos_obs: '',
        observaciones: '',
        detalle_lesiones_equinos: '', detalle_lesiones_bovinos: ''
    }, _respuestasJson.informe_veterinario || {});

    const fechaRodeo = rodeo?.fecha
        ? new Date(rodeo.fecha + 'T12:00:00').toLocaleDateString('es-CL', { weekday:'long', year:'numeric', month:'long', day:'numeric' })
        : '—';

    let html = '';

    // ── Indicador de plazo de 3 días desde el rodeo ──────────────────────
    if (rodeo?.fecha && (_estado === 'borrador' || _estado === 'nueva' || _estado === 'observada')) {
        const fechaLimite = new Date(rodeo.fecha + 'T12:00:00');
        fechaLimite.setDate(fechaLimite.getDate() + 3);
        const diasRestantes = Math.ceil((fechaLimite - new Date()) / (1000 * 60 * 60 * 24));
        if (diasRestantes < 0) {
            html += `<div class="plazo-vencido">⚠ El plazo de envío venció hace ${Math.abs(diasRestantes)} día(s) (${fechaLimite.toLocaleDateString('es-CL')}). Envíe el informe a la brevedad.</div>`;
        } else if (diasRestantes <= 1) {
            html += `<div class="plazo-proximo">⏰ El plazo de envío vence el ${fechaLimite.toLocaleDateString('es-CL')} — en ${diasRestantes} día(s).</div>`;
        }
    }

    // ── Banners de estado ─────────────────────────────────────────────────
    if (_estado === 'enviada' || _estado === 'reenviada') {
        const fechaEnv = cartilla.enviada_en ? new Date(cartilla.enviada_en).toLocaleString('es-CL') : '—';
        const label = _estado === 'reenviada' ? 'Informe reenviado' : 'Informe enviado';
        html += `<div class="enviada-notice">
            <strong>${label}</strong>
            Esta cartilla fue enviada el ${fechaEnv}. Solo puede ser reabierta por el Administrador.
        </div>`;
    } else if (_estado === 'observada') {
        const motivo = sanitizar(cartilla.observacion_admin || '');
        const obsEn  = cartilla.observada_en ? new Date(cartilla.observada_en).toLocaleString('es-CL') : '—';
        html += `<div class="observada-banner">
            <strong>⚠ Cartilla bajo revisión — Requiere correcciones</strong>
            El Administrador ha revisado tu informe y solicita ajustes (${obsEn}).
            ${motivo ? `<div class="motivo-obs">${motivo}</div>` : ''}
            <div style="margin-top:8px;font-size:13px;color:#555;">Puedes editar y reenviar el informe a continuación.</div>
        </div>`;
    } else if (_estado === 'aprobada') {
        const aprobadaEn = cartilla.aprobada_en ? new Date(cartilla.aprobada_en).toLocaleString('es-CL') : '—';
        html += `<div class="aprobada-notice">
            <strong>✔ Informe aprobado</strong>
            Tu cartilla fue aprobada el ${aprobadaEn}. Ya no puede ser modificada.
        </div>`;
    }

    // ── Estado badges ─────────────────────────────────────────────────────
    const _estadoBadgeMap = { enviada:'estado-enviada', reenviada:'estado-reenviada', observada:'estado-observada', aprobada:'estado-aprobada', borrador:'estado-borrador' };
    const _estadoLabelMap = { enviada:'Enviada', reenviada:'Reenviada', observada:'Observada', aprobada:'Aprobada', borrador:'Borrador', nueva:'Nueva' };

// ═════════════════════════════════════════════════════════════════════════════
// SECCIÓN I — INFORMACIÓN DE LAS SERIES E INFORME DEL GANADO (UNIFICADA)
// 4ª revisión: se unifican "I. Series" + "II. Ganado" en una sola sección —
// misma fuente de datos `_seriesGanado`, SIN cambiar el formato de
// almacenamiento (mismas claves c{n}n/c{n}g/v{n}v/v{n}t/v{n}p/q{n}c/q{n}r/
// q{n}k/fp_tot/fp_baj/fp_sob por serie, n=1..4). El Delegado selecciona la
// Serie UNA sola vez y completa colleras/vueltas/ganado desde el mismo
// lugar — ya no hay que volver a elegir la misma Serie en otra tabla.
// ═════════════════════════════════════════════════════════════════════════════

// Catálogo oficial de Series — específico de Cartilla de Delegado (no es un
// catálogo global del sistema; no se tocó ningún catálogo compartido con
// otros módulos). Lista EXACTA pedida en la 4ª revisión.
const CATALOGO_SERIES_DELEGADO = [
    '10a. Libre', '1ra. Libre', '1ra. Libre A', '1ra. Libre B',
    '2a. Libre', '2a. Libre A', '2a. Libre B',
    '3ra. Libre', '3ra. Libre A', '3ra. Libre B',
    '4a. Libre', '5a. Libre', '6a. Libre', '7a. Libre', '8a. Libre', '9a. Libre',
    'Caballos', 'Criaderos', 'Expositores', 'Menores', 'Mixta', 'Mixta-Criaderos', 'Potros', 'Yeguas'
];

// Los 8 campos base por animal (n = 1..4), mismas claves ya usadas en
// `_seriesGanado` desde el formato anterior — no se agrega ni renombra
// ningún campo del JSON. El "Ganado bajo/sobrepeso reglamentario" y su "%"
// (5ª revisión, punto 2) se agregan APARTE en renderSerieCard, porque el
// porcentaje es un valor CALCULADO de solo lectura, no un campo editable
// más de esta lista genérica.
function camposAnimal(n) {
    return [
        { key: `c${n}n`, label: 'N° colleras', type: 'number' },
        { key: `c${n}g`, label: '# Ganado', type: 'text' },
        { key: `v${n}v`, label: 'N° vueltas apiñadero', type: 'number' },
        { key: `v${n}t`, label: 'Tipo de ganado', type: 'text' },
        { key: `v${n}p`, label: 'Peso del ganado (kg)', type: 'number' },
        { key: `q${n}c`, label: 'Ganado corrido', type: 'number' },
        { key: `q${n}r`, label: 'Ganado repetido', type: 'number' },
        { key: `q${n}k`, label: 'Calidad del ganado', type: 'select', opts: ['Bueno', 'Regular', 'Malo'] }
    ];
}

// Ganado bajo/sobrepeso reglamentario — 5ª revisión, punto 2: el documento
// oficial lo pide POR CADA ANIMAL (Art. 242), no solo como total de la
// Serie. Se agrega de forma ADITIVA (`f1c`..`f4c`, nuevas claves dentro del
// mismo objeto de serie, mismo patrón c{n}n/v{n}v/q{n}c ya usado) SIN tocar
// ni renombrar los campos históricos `fp_tot`/`fp_baj`/`fp_sob` (que eran
// SOLO por Serie, ver punto 3). El "% bajo/sobrepeso reglamentario" NUNCA
// se guarda — se calcula siempre desde "# Ganado" (c{n}g) y esta cantidad,
// con la MISMA fórmula probada en cartillaDelegadoGanado.test.js (backend).
function calcularPctFueraPesoAnimal(cantidadGanado, cantidadFueraPeso) {
    const ganado = parseFloat(cantidadGanado);
    if (isNaN(ganado) || ganado <= 0) return null; // evita división por cero — nunca 0% falso
    const fuera = parseFloat(cantidadFueraPeso);
    const fueraValida = (!isNaN(fuera) && fuera >= 0) ? fuera : 0;
    return Math.round((fueraValida / ganado) * 1000) / 10;
}

// Una Serie usa el formato ANTIGUO (fuera de peso solo a nivel de Serie,
// campos fp_tot/fp_baj/fp_sob) si ya tiene datos guardados ahí Y todavía no
// tiene ningún dato en el formato nuevo por animal (f1c..f4c) — detección
// por presencia de datos, igual que Recinto Deportivo, sin bandera de
// versión ni migración. Una Serie nueva (sin datos) usa el formato nuevo.
function esFueraPesoLegacy(s) {
    const tieneLegacy = !!(s.fp_tot || s.fp_baj || s.fp_sob);
    const tieneNuevo  = !!(s.f1c || s.f2c || s.f3c || s.f4c);
    return tieneLegacy && !tieneNuevo;
}

// Total de "# Ganado" y total "fuera de peso" de una Serie, sin importar el
// formato (legacy o por animal) — usado para el resumen por Serie y para
// el total general de la sección.
function totalFueraPesoSerie(s) {
    if (esFueraPesoLegacy(s)) {
        return { tot: numPos(s.fp_tot), fuera: numPos(s.fp_baj) + numPos(s.fp_sob) };
    }
    let tot = 0, fuera = 0;
    [1, 2, 3, 4].forEach(n => { tot += numPos(s['c' + n + 'g']); fuera += numPos(s['f' + n + 'c']); });
    return { tot, fuera };
}

// Refresca el "%" de solo lectura de un animal apenas cambia "# Ganado" o
// "Ganado bajo/sobrepeso reglamentario" — actualización puntual (no
// re-renderiza toda la tarjeta) para no perder el foco mientras se escribe.
function actualizarPctAnimal(i, n) {
    const s = _seriesGanado[i];
    if (!s) return;
    const pct = calcularPctFueraPesoAnimal(s['c' + n + 'g'], s['f' + n + 'c']);
    const el = document.getElementById('pct_animal_' + i + '_' + n);
    if (el) el.value = pct !== null ? pct.toFixed(1) + '%' : '—';
    actualizarAvisoFueraPeso();
}

function renderSeriesGanadoUnificado(ya) {
    const cont = document.getElementById('series-ganado-cuerpo');
    if (!cont) return;
    const haySeries = _seriesGanado.length > 0;
    let html = '';
    if (!haySeries && !ya) {
        html += `<div class="alerta alerta-info" style="font-size:13px;margin-bottom:12px;">No hay series registradas. Haga clic en <strong>+ Agregar serie</strong> para comenzar.</div>`;
    }
    html += `<div id="aviso-ganado-bajo-peso" class="aviso-ganado-bajo-peso">⚠ Ha ingresado datos de ganado fuera de peso. Se recomienda marcar "Sí" en "¿Incluye informe de ganado bajo peso?" (Sección I).</div>`;
    html += _seriesGanado.map((s, i) => renderSerieCard(s, i, ya)).join('');
    if (!ya) {
        html += `<button class="btn btn-outline btn-agregar-serie" onclick="agregarSerie()">+ Agregar serie</button>`;
    }
    if (haySeries) {
        html += renderResumenFueraPeso();
    }
    cont.innerHTML = html;
    actualizarAvisoFueraPeso();
}

function optsSerieSelect(idxActual) {
    const usadas = new Set(_seriesGanado.filter((s, j) => j !== idxActual).map(s => s.nombre).filter(Boolean));
    const valorActual = _seriesGanado[idxActual]?.nombre || '';
    let opts = `<option value="">— Seleccionar serie —</option>`;
    // Valor histórico que ya no está en el catálogo oficial (cartilla
    // antigua) — se conserva visible y seleccionado, nunca se pierde.
    if (valorActual && !CATALOGO_SERIES_DELEGADO.includes(valorActual)) {
        opts += `<option value="${esc(valorActual)}" selected>${esc(valorActual)} (histórica)</option>`;
    }
    opts += CATALOGO_SERIES_DELEGADO.map(v => {
        const usada = usadas.has(v) && v !== valorActual;
        return `<option value="${esc(v)}" ${v === valorActual ? 'selected' : ''} ${usada ? 'disabled' : ''}>${esc(v)}${usada ? ' (ya agregada)' : ''}</option>`;
    }).join('');
    return opts;
}

function renderSerieCard(s, i, ya) {
    const dis = ya ? 'disabled' : '';
    const legacy = esFueraPesoLegacy(s);
    const animales = [1, 2, 3, 4].map(n => {
        const campos = camposAnimal(n).map(c => {
            const val = esc(s[c.key] || '');
            const esNumeroGanado = c.key === `c${n}g`;
            const refrescoExtra = esNumeroGanado ? `;actualizarPctAnimal(${i},${n})` : '';
            if (c.type === 'select') {
                const opts = c.opts.map(o => `<option value="${o}" ${s[c.key] === o ? 'selected' : ''}>${o}</option>`).join('');
                return `<div class="animal-field"><label>${c.label}</label><select ${dis} onchange="setCelda(${i},'${c.key}',this.value)${refrescoExtra}"><option value="">—</option>${opts}</select></div>`;
            }
            const tipoInput = c.type === 'number' ? 'type="number" min="0"' : 'type="text"';
            return `<div class="animal-field"><label>${c.label}</label><input ${tipoInput} value="${val}" ${dis} oninput="setCelda(${i},'${c.key}',this.value)${refrescoExtra}"></div>`;
        }).join('');

        // Ganado bajo/sobrepeso reglamentario + "%" — SOLO en formato nuevo
        // (5ª revisión, punto 2): por cada animal, no solo total de la
        // Serie. En formato legacy no se muestra acá (esos datos viven a
        // nivel de Serie, ver bloque `bloqueFueraPesoSerie` más abajo).
        let bloqueFueraPesoAnimal = '';
        if (!legacy) {
            const pct = calcularPctFueraPesoAnimal(s['c' + n + 'g'], s['f' + n + 'c']);
            bloqueFueraPesoAnimal = `
            <div class="animal-field"><label>Ganado bajo/sobrepeso reglamentario</label><input type="number" min="0" value="${esc(s['f' + n + 'c'] || '')}" ${dis} oninput="setCelda(${i},'f${n}c',this.value);actualizarPctAnimal(${i},${n})"></div>
            <div class="animal-field"><label>% bajo/sobrepeso reglamentario</label><input type="text" readonly disabled id="pct_animal_${i}_${n}" value="${pct !== null ? pct.toFixed(1) + '%' : '—'}"></div>`;
        }

        const nombreAnimal = ['1er Animal', '2do Animal', '3er Animal', '4to Animal'][n - 1];
        return `<div class="animal-card">
            <div class="animal-card-header">${nombreAnimal}</div>
            <div class="animal-card-body">${campos}${bloqueFueraPesoAnimal}</div>
        </div>`;
    }).join('');

    // Bloque de fuera de peso a nivel de Serie: formato ANTIGUO (editable,
    // 3 campos compartidos) se conserva intacto para cartillas que ya lo
    // usaban; formato NUEVO muestra un RESUMEN de solo lectura (suma de los
    // 4 animales) — nunca sustituye los datos individuales por animal.
    let bloqueFueraPesoSerie;
    if (legacy) {
        const tot = numPos(s.fp_tot), baj = numPos(s.fp_baj), sob = numPos(s.fp_sob);
        const fuer = baj + sob, pct = tot > 0 ? ((fuer / tot) * 100).toFixed(1) : null;
        bloqueFueraPesoSerie = `<div class="serie-fuera-peso">
                <div class="sub-titulo-ganado">Ganado fuera de peso reglamentario (Art. 242) — formato anterior, por Serie</div>
                <p style="font-size:11px;color:#888;font-style:italic;margin:0 0 8px;">Esta Serie fue registrada con el formato anterior (total por Serie). Las Series nuevas registran el fuera de peso por cada animal.</p>
                <div class="campo-grid">
                    <div><label class="form-label">Total animales utilizados</label><input type="number" min="0" class="form-control" id="fp_tot_${i}" value="${esc(s.fp_tot||'')}" ${dis} oninput="setCelda(${i},'fp_tot',this.value);actualizarAvisoFueraPeso()"></div>
                    <div><label class="form-label">Ganado bajo peso</label><input type="number" min="0" class="form-control" id="fp_baj_${i}" value="${esc(s.fp_baj||'')}" ${dis} oninput="setCelda(${i},'fp_baj',this.value);actualizarAvisoFueraPeso()"></div>
                    <div><label class="form-label">Ganado sobre peso</label><input type="number" min="0" class="form-control" id="fp_sob_${i}" value="${esc(s.fp_sob||'')}" ${dis} oninput="setCelda(${i},'fp_sob',this.value);actualizarAvisoFueraPeso()"></div>
                </div>
                <p style="font-size:12px;color:#555;margin:0;">Total fuera de peso: <strong id="fp_fuer_${i}">${fuer > 0 ? fuer : '—'}</strong> &nbsp;|&nbsp; % fuera de peso: <strong id="fp_pct_${i}">${pct !== null ? pct + '%' : '—'}</strong></p>
            </div>`;
    } else {
        const { tot, fuera } = totalFueraPesoSerie(s);
        const pct = calcularPctFueraPesoAnimal(tot, fuera);
        bloqueFueraPesoSerie = `<div class="serie-fuera-peso">
                <div class="sub-titulo-ganado">Resumen — Ganado fuera de peso reglamentario (suma de los 4 animales)</div>
                <p id="resumen_fp_serie_${i}" style="font-size:12px;color:#555;margin:0;">Total ganado: <strong>${tot || '—'}</strong> &nbsp;|&nbsp; Total fuera de peso: <strong>${fuera > 0 ? fuera : '—'}</strong> &nbsp;|&nbsp; % fuera de peso: <strong>${pct !== null ? pct.toFixed(1) + '%' : '—'}</strong></p>
            </div>`;
    }

    return `<div class="serie-card">
        <div class="serie-card-header">
            <label>Serie</label>
            <select ${dis} onchange="setSerieNombre(${i},this.value)">${optsSerieSelect(i)}</select>
            ${ya ? '' : `<button class="btn-quitar-serie" style="color:#fff;" onclick="quitarSerie(${i})" title="Quitar serie">✕ Quitar serie</button>`}
        </div>
        <div class="serie-card-body">
            <div class="animales-grid">${animales}</div>
            ${bloqueFueraPesoSerie}
        </div>
    </div>`;
}

function renderResumenFueraPeso() {
    return `<div class="serie-card"><div class="serie-card-body" style="background:#fff;">
        <div class="sub-titulo-ganado">Totales generales de la sección (todas las series)</div>
        <p style="font-size:13px;color:#333;margin:0;">
            Total ganado: <strong id="fp-total-tot">—</strong> &nbsp;|&nbsp;
            Total fuera de peso (bajo/sobrepeso): <strong id="fp-total-fuer">—</strong> &nbsp;|&nbsp;
            % fuera de peso: <strong id="fp-total-pct">—</strong>
        </p>
    </div></div>`;
}

function actualizarAvisoFueraPeso() {
    let sumTot = 0, sumFuera = 0, hayDatos = false;
    _seriesGanado.forEach(function(s, i) {
        const { tot, fuera } = totalFueraPesoSerie(s);
        sumTot += tot; sumFuera += fuera;
        if (tot > 0 || fuera > 0) hayDatos = true;
        if (esFueraPesoLegacy(s)) {
            const pct = tot > 0 ? ((fuera / tot) * 100).toFixed(1) : null;
            const elFuer = document.getElementById('fp_fuer_' + i), elPct = document.getElementById('fp_pct_' + i);
            if (elFuer) elFuer.textContent = fuera > 0 ? fuera : '—';
            if (elPct)  elPct.textContent  = pct !== null ? pct + '%' : '—';
        } else {
            const elResumen = document.getElementById('resumen_fp_serie_' + i);
            if (elResumen) {
                const pct = calcularPctFueraPesoAnimal(tot, fuera);
                elResumen.innerHTML = `Total ganado: <strong>${tot || '—'}</strong> &nbsp;|&nbsp; Total fuera de peso: <strong>${fuera > 0 ? fuera : '—'}</strong> &nbsp;|&nbsp; % fuera de peso: <strong>${pct !== null ? pct.toFixed(1) + '%' : '—'}</strong>`;
            }
        }
    });
    const pctTotal = calcularPctFueraPesoAnimal(sumTot, sumFuera);
    setText('fp-total-tot', hayDatos ? sumTot : '—');
    setText('fp-total-fuer', hayDatos ? sumFuera : '—');
    setText('fp-total-pct', pctTotal !== null ? pctTotal.toFixed(1) + '%' : '—');
    const aviso=document.getElementById('aviso-ganado-bajo-peso');
    if(aviso){ const radioSi=document.getElementById('r-ganado-bajo-si'); aviso.style.display=(sumFuera>0&&!(radioSi&&radioSi.checked))?'block':'none'; }
}

function setText(id,val){ const el=document.getElementById(id); if(el) el.textContent=val; }
function numPos(v){ const n=parseFloat(v); return(!isNaN(n)&&n>=0)?n:0; }
function esc(v){ return String(v??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function agregarSerie(){
    _seriesGanado.push({nombre:''});
    const ya = ['enviada', 'reenviada', 'aprobada'].includes(_estado);
    renderSeriesGanadoUnificado(ya);
    renderFaltasPorSerie(ya);
}

// Evita series duplicadas (punto 11 de la 4ª revisión): las opciones ya
// usadas por OTRA serie quedan `disabled` en el <select> (ver
// optsSerieSelect), y esta validación es una segunda barrera defensiva.
function setSerieNombre(idx, valor) {
    const ya = ['enviada', 'reenviada', 'aprobada'].includes(_estado);
    if (valor && _seriesGanado.some((s, j) => j !== idx && s.nombre === valor)) {
        alert('Esta serie ya fue agregada a la cartilla. Seleccione una serie distinta.');
        renderSeriesGanadoUnificado(ya); // revierte el <select> a su valor anterior
        return;
    }
    if (_seriesGanado[idx]) _seriesGanado[idx].nombre = valor;
    renderSeriesGanadoUnificado(ya); // refresca disabled= de las demás series
    renderFaltasPorSerie(ya);
}

function serieTieneDatos(s) {
    return Object.keys(s).some(k => k !== 'nombre' && s[k] !== '' && s[k] !== null && s[k] !== undefined);
}

function quitarSerie(idx){
    const s = _seriesGanado[idx];
    if (!s) return;
    const msg = serieTieneDatos(s)
        ? 'Esta serie contiene información. ¿Seguro que deseas eliminarla?'
        : '¿Quitar esta serie?';
    if (!confirm(msg)) return;
    _seriesGanado.splice(idx, 1);
    const ya = ['enviada', 'reenviada', 'aprobada'].includes(_estado);
    renderSeriesGanadoUnificado(ya);
    renderFaltasPorSerie(ya);
}

function setCelda(idx,campo,valor){ if(_seriesGanado[idx]) _seriesGanado[idx][campo]=valor; }

// ETAPA 3 — INICIALIZACIÓN

function _initSecciones3(cartilla) {
    const rj = _respuestasJson;
    // Nuevo formato 2026-2027: exactamente 4 aspectos (1.0-7.0) + Nota
    // Promedio automática. Los campos antiguos (evaluacion_realizada,
    // cantidad_jurados, jurados[]...) se conservan por compatibilidad de
    // LECTURA de cartillas ya enviadas con el formato anterior — nunca se
    // eliminan ni se pisan — pero ya no se editan desde esta pantalla.
    _dj      = Object.assign({ evaluacion_realizada:null, fecha_evaluacion:'', cantidad_jurados:'', mas_de_un_jurado:null, observaciones:'', jurados:[], aspecto_1:null, aspecto_2:null, aspecto_3:null, aspecto_4:null, nota_promedio:null }, rj.desempeno_jurado  || {});
    _disc    = Object.assign({ hubo_informe:null, situaciones:[] }, rj.disciplina_informe || {});
    _recinto = Object.assign({}, rj.recinto_deportivo || {});
    _col     = Object.assign({ no_hubo:false, items:[] }, rj.colleras_invitadas || {});
    _ree     = Object.assign({ hubo:null, items:[] }, rj.reemplazo_jinetes || {});

    const ya = ['enviada', 'reenviada', 'aprobada'].includes(_estado);
    renderSeccionDesempeno(ya);
    renderSeccionDisciplina(ya);
    renderSeccionRecinto(ya);
    renderSeccionColleras(ya);
    renderSeccionReemplazo(ya);
    renderFaltasPorSerie(ya);
}

// SECCIÓN III — DESEMPEÑO DEL JURADO (nuevo formato 2026-2027)
// Exactamente 4 aspectos, nota 1.0-7.0 cada uno, Nota Promedio automática.
// La Nota Promedio alimenta DIRECTAMENTE rodeo_notas_secundarias.nota_delegado
// al enviar el informe (services/cartillaDelegadoNotas.js, backend) — misma
// fuente que ya usan los reportes/exportaciones del sistema, nunca una nota
// paralela. Validación de rango idéntica en frontend y backend.
// ═════════════════════════════════════════════════════════════════════════════

const ASPECTOS_DESEMPENO_UI = [
    { key:'aspecto_1', label:'1. Sanciona correctamente las faltas en el apiñadero.' },
    { key:'aspecto_2', label:'2. Sanciona correctamente las faltas en la cancha (incluye zona de postura).' },
    { key:'aspecto_3', label:'3. Identifica correctamente atajadas válidas (0-2-3-4). Justifica correctamente las atajadas no válidas. Sanciona correctamente las faltas que se producen en la atajada.' },
    { key:'aspecto_4', label:'4. Sanciona correctamente las faltas que se producen en la cuarta carrera (entrega del novillo).' }
];

function calcularPromedioDesempenoUI() {
    const notas = ASPECTOS_DESEMPENO_UI.map(a => _dj[a.key]);
    if (notas.some(n => n === null || n === undefined || n === '')) return null;
    const nums = notas.map(Number);
    if (nums.some(n => isNaN(n) || n < 1 || n > 7)) return null;
    return Math.round((nums.reduce((a,b)=>a+b,0) / 4) * 10) / 10;
}

function renderSeccionDesempeno(ya) {
    const cont = document.getElementById('sec-desempeno');
    if (!cont) return;
    const ro = ya ? 'disabled' : '';

    const filas = ASPECTOS_DESEMPENO_UI.map(a => `
        <div class="aspecto-desemp" style="margin-bottom:14px;padding:10px 14px;background:#fafcff;border:1px solid #e0e8f5;border-radius:6px;">
            <label class="form-label" style="margin-bottom:6px;">${sanitizar(a.label)}</label>
            <input type="number" min="1" max="7" step="0.1" class="form-control" style="max-width:140px;"
                value="${_dj[a.key] !== null && _dj[a.key] !== undefined ? esc(_dj[a.key]) : ''}"
                ${ro} placeholder="1.0 – 7.0"
                oninput="setAspectoDesemp('${a.key}', this.value)">
        </div>`).join('');

    const promedio = calcularPromedioDesempenoUI();
    _dj.nota_promedio = promedio;

    cont.innerHTML = `
    <p style="font-size:13px;color:#555;margin:0 0 14px;">Califique cada aspecto con una nota de <strong>1,0 a 7,0</strong>. La Nota Promedio se calcula automáticamente y queda registrada como la Nota Delegado de este rodeo.</p>
    ${filas}
    <div id="dj-promedio-wrap" style="margin-top:10px;padding:12px 16px;background:${promedio!==null?'#eafaf1':'#fff8e1'};border:1px solid ${promedio!==null?'#27ae60':'#ffc107'};border-radius:8px;display:flex;align-items:center;justify-content:space-between;">
        <span style="font-weight:700;color:${promedio!==null?'#145a32':'#795800'};">NOTA PROMEDIO</span>
        <span id="dj-promedio-valor" style="font-size:20px;font-weight:700;color:${promedio!==null?'#145a32':'#795800'};">${promedio!==null?promedio.toFixed(1):'Pendiente'}</span>
    </div>
    <div style="margin-top:14px;">
        <label class="form-label">Observaciones del delegado sobre el desempeño</label>
        <textarea class="form-control" rows="3" ${ya?'readonly':''} oninput="setCampoDesemp('observaciones',this.value)" placeholder="Observaciones generales...">${esc(_dj.observaciones||'')}</textarea>
    </div>`;
}

function setAspectoDesemp(key, valor) {
    _dj[key] = valor === '' ? null : valor;
    const promedio = calcularPromedioDesempenoUI();
    _dj.nota_promedio = promedio;
    const wrap = document.getElementById('dj-promedio-wrap');
    const val  = document.getElementById('dj-promedio-valor');
    if (val) val.textContent = promedio !== null ? promedio.toFixed(1) : 'Pendiente';
    if (wrap) {
        wrap.style.background   = promedio !== null ? '#eafaf1' : '#fff8e1';
        wrap.style.borderColor  = promedio !== null ? '#27ae60' : '#ffc107';
        wrap.querySelectorAll('span').forEach(s => { s.style.color = promedio !== null ? '#145a32' : '#795800'; });
    }
}

function setCampoDesemp(campo, valor) { _dj[campo] = valor; }

function renderSeccionDisciplina(ya) {
    const cont = document.getElementById('sec-disciplina');
    if (!cont) return;
    const dis = ya ? 'disabled' : '';
    const chk = (val) => _disc.hubo_informe === val ? 'checked' : '';
    const huboSi = _disc.hubo_informe === 'si';

    // Verificar si ETAPA 1 ya tiene el radio SI
    const mostrarAvisoE1 = huboSi && !ya;

    cont.innerHTML = `
    <p style="font-size:13px;color:#555;margin:0 0 14px;">Si existieron faltas reglamentarias o disciplinarias, describa cada situación indicando los antecedentes del infractor y los hechos.</p>
    <div style="margin-bottom:12px;">
        <label class="form-label">¿Hubo informe de disciplina en este rodeo?</label>
        <div class="radio-grupo">
            <label><input type="radio" name="disc_hubo" value="si" ${chk('si')} ${dis} onchange="setDiscHubo('si')"> Sí</label>
            <label><input type="radio" name="disc_hubo" value="no" ${chk('no')} ${dis} onchange="setDiscHubo('no')"> No</label>
        </div>
    </div>
    <div id="disc-aviso-e1" class="aviso-relacion" style="display:${mostrarAvisoE1?'block':'none'};">

    </div>
    <div id="disc-situaciones-wrap" style="display:${huboSi?'block':'none'};">
        <div class="sec-sub">Situaciones disciplinarias</div>
        <div id="disc-situaciones-cont"></div>
        ${ya ? '' : `<button class="btn btn-outline btn-agregar-serie" onclick="agregarSituacion()">+ Agregar situación</button>`}
    </div>`;

    renderTablaDisciplina(ya);
}

function renderTablaDisciplina(ya) {
    const cont = document.getElementById('disc-situaciones-cont');
    if (!cont) return;
    if (_disc.situaciones.length === 0) {
        cont.innerHTML = '<p style="font-size:12px;color:#888;font-style:italic;margin:4px 0 8px;">Sin situaciones registradas. Agregue una situación disciplinaria.</p>';
        return;
    }
    const dis = ya ? 'disabled' : '';
    const ro  = ya ? 'readonly' : '';
    cont.innerHTML = _disc.situaciones.map((s,i) => `
    <div class="sit-card">
        <div class="sit-card-hdr">
            Situación N° ${i+1}
            ${ya ? '' : `<button class="btn-q" onclick="quitarSituacion(${i})">✕ Eliminar</button>`}
        </div>
        <div class="sit-card-body">
            <div class="campo-form-sm">
                <label>Nombre del infractor</label>
                <input type="text" value="${esc(s.nombre_infractor||'')}" ${ro} oninput="setSituacion(${i},'nombre_infractor',this.value)" placeholder="Nombre completo">
            </div>
            <div class="campo-form-sm">
                <label>RUT</label>
                <input type="text" value="${esc(s.rut||'')}" ${ro} oninput="setSituacion(${i},'rut',this.value)" placeholder="Ej: 12.345.678-9">
            </div>
            <div class="campo-form-sm">
                <label>N° de socio</label>
                <input type="text" value="${esc(s.num_socio||'')}" ${ro} oninput="setSituacion(${i},'num_socio',this.value)" placeholder="N° socio">
            </div>

// Formato antiguo (18 aspectos) — se conserva SOLO para poder seguir
// mostrando/editando cartillas ya guardadas con este formato.
const ASPECTOS_RECINTO_LEGACY = [

    {key:'atajadas',               label:'Atajadas'},
    {key:'toril',                  label:'Toril'},
    {key:'corrales',               label:'Corrales'},
    {key:'picadero',               label:'Picadero'},
    {key:'caseta_jurado',          label:'Caseta del Jurado'},
    {key:'caseta_filmacion',       label:'Caseta de filmación'},
    {key:'casinos',                label:'Casinos'},
    {key:'banhos',                 label:'Baños'},
    {key:'duchas_petiseros',       label:'Duchas para petiseros'},
    {key:'graderias',              label:'Graderías'},

];

// Formato nuevo (documento oficial 2026-2027) — 4 campos con estado +
// observación, más "Otros" como texto libre (comparten la key 'otros' del
// formato anterior, que ya era texto libre en ambos casos).
const ASPECTOS_RECINTO_NUEVO = [
    {key:'cancha',                 label:'Cancha'},
    {key:'iluminacion_cancha',     label:'Iluminación'},
    {key:'instalaciones_publicas', label:'Instalaciones públicas'},
    {key:'casetas_jurados',        label:'Casetas de jurados'}
];

// Una cartilla es "formato antiguo" si tiene datos guardados en alguna de
// las keys EXCLUSIVAS del formato de 18 aspectos (evita falsos positivos:
// 'otros' es común a ambos formatos y no se usa para decidir).
function esRecintoFormatoLegacy() {
    return ASPECTOS_RECINTO_LEGACY.some(a => _recinto[a.key+'_estado'] || _recinto[a.key+'_obs']);
}

function renderSeccionRecinto(ya) {
    const cont = document.getElementById('sec-recinto');
    if (!cont) return;
    const dis = ya ? 'disabled' : '';
    const ro  = ya ? 'readonly' : '';
    const estadoOpts = (k) => ['Bueno','Regular','Malo','No aplica'].map(o =>
        `<option value="${o}" ${_recinto[k+'_estado']===o?'selected':''}>${o}</option>`).join('');
    const legacy = esRecintoFormatoLegacy();
    const aspectos = legacy ? ASPECTOS_RECINTO_LEGACY : ASPECTOS_RECINTO_NUEVO;

    const cards = aspectos.map(a => `
    <div class="aspecto-card">
        <span class="aspecto-label">${sanitizar(a.label)}</span>

function _initSecciones4(cartilla) {

    // vacías — no se transforma ni se completa con datos de `_acc`.
    _accGeneral = rj.informe_accidentes_general || '';
    // Bienestar Animal / Veterinario — nuevo formato 2026-2027: cada
    // pregunta Sí/No ahora tiene su propia Observación (campos `_obs`,
    // ADITIVOS) y las lesiones se registran separadas por Equinos/Bovinos
    // (`detalle_lesiones_equinos`/`detalle_lesiones_bovinos`) en vez de un
    // único campo mezclado. `detalle_lesiones` (campo anterior) se conserva

    _ba   = Object.assign({

        sombra_equinos: null, sombra_equinos_obs: '',

        agua_equinos: null, agua_equinos_obs: '',
        comida_ganado: null, comida_ganado_obs: '',
        comida_equinos: null, comida_equinos_obs: '',
        hubo_lesiones_equinos: null, hubo_lesiones_bovinos: null,
        observaciones: '', detalle_lesiones: '',
        detalle_lesiones_equinos: '', detalle_lesiones_bovinos: ''
    }, rj.bienestar_animal     || {});
    _vet  = Object.assign({
        nombre: '', telefono: '', correo: '',
        preparacion: '', especifica_tecnico: '', especifica_otro: '',
        sombra_ganado: null, sombra_ganado_obs: '',
        sombra_equinos: null, sombra_equinos_obs: '',
        agua_ganado: null, agua_ganado_obs: '',
        agua_equinos: null, agua_equinos_obs: '',
        comida_ganado: null, comida_ganado_obs: '',
        comida_equinos: null, comida_equinos_obs: '',
        observaciones: '',
        detalle_lesiones_equinos: '', detalle_lesiones_bovinos: ''
    }, rj.informe_veterinario  || {});
    _recs = Object.assign({
        hubo_reclamos: null, sugerencias: '',
        observaciones_generales: '', items: []
    }, rj.reclamos_sugerencias || {});
    // Anexo 03 — Comentarios generales / Anexo 04 — Antecedentes
    // disciplinarios complementarios (nuevo formato 2026-2027).
    _com  = Object.assign({ texto: '' }, rj.comentarios_generales || {});
    _ant  = Object.assign({ texto: '' }, rj.antecedentes_disciplinarios || {});

    const ya = ['enviada', 'reenviada', 'aprobada'].includes(_estado);
    renderSeccionAccidentes(ya);
    renderAccidentesBreve(ya);
    renderSeccionBienestar(ya);
    renderSeccionVeterinario(ya);
    renderSeccionComentarios(ya);
    renderSeccionAntecedentes(ya);
    renderSeccionReclamos(ya);
    renderSeccionAdjuntos(ya);
}

            </div>
            <div class="campo-form-sm">
                <label>Categoría</label>
                <select ${dis} onchange="setAccItem(${i},'categoria',this.value)"><option value="">—</option>${optsC(a.categoria)}</select>

                <label>Nombre del centro asistencial</label>
                <input type="text" value="${esc(a.centro_asistencial||'')}" ${ro} oninput="setAccItem(${i},'centro_asistencial',this.value)" placeholder="Hospital, clínica, etc.">
            </div>

                <label>Descripción del accidente</label>
                <textarea rows="2" ${ro} oninput="setAccItem(${i},'descripcion',this.value)">${esc(a.descripcion||'')}</textarea>
            </div>
            <div class="campo-form-sm sit-card-full">
                <label>Atención realizada</label>

function toggleAccTabla() {
    const w = document.getElementById('acc-tabla-wrap');
    if (w) w.style.display = _acc.hubo_accidentes === 'si' ? 'block' : 'none';
}

function toggleCentro(idx) {
    const w = document.getElementById('acc-centro-' + idx);
    if (w) w.style.display = (_acc.items[idx] && _acc.items[idx].derivado === 'si') ? 'block' : 'none';
}

function setAccCampo(campo, valor) { _acc[campo] = valor; }
function setAccItem(idx, campo, valor) { if (_acc.items[idx]) _acc.items[idx][campo] = valor; }

function agregarAccidente() {
    _acc.items.push({ tipo:'', fecha_hora:'', persona:'', rut:'', categoria:'', derivado:'', centro_asistencial:'', descripcion:'', atencion:'', observaciones:'' });
    renderAccidentesItems(false);
}

function quitarAccidente(idx) {
    if (!confirm('¿Eliminar este accidente?')) return;
    _acc.items.splice(idx, 1);
    renderAccidentesItems(false);
}

// SECCIÓN XII — RECLAMOS O SUGERENCIAS
// ═════════════════════════════════════════════════════════════════════════════

function renderSeccionReclamos(ya) {
    const cont = document.getElementById('sec-reclamos');
    if (!cont) return;
    const dis = ya ? 'disabled' : '';
    const ro  = ya ? 'readonly' : '';
    const chk = (val) => _recs.hubo_reclamos === val ? 'checked' : '';
    const huboSi = _recs.hubo_reclamos === 'si';

    cont.innerHTML = `
    <div style="margin-bottom:14px;">
        <label class="form-label">¿Hubo reclamos en este Rodeo?</label>
        <div class="radio-grupo">
            <label><input type="radio" name="recs_hubo" value="si" ${chk('si')} ${dis} onchange="setRecsCampo('hubo_reclamos','si');toggleRecsTabla()"> Sí</label>
            <label><input type="radio" name="recs_hubo" value="no" ${chk('no')} ${dis} onchange="setRecsCampo('hubo_reclamos','no');toggleRecsTabla()"> No</label>
        </div>
    </div>

    <div id="recs-tabla-wrap" style="display:${huboSi?'block':'none'};">
        <div class="sec-sub">Reclamos recibidos</div>
        <div id="recs-items-cont"></div>
        ${ya ? '' : `<button class="btn btn-outline btn-agregar-serie" onclick="agregarReclamo()">+ Agregar reclamo</button>`}
    </div>

    <div style="margin-top:14px;margin-bottom:12px;">
        <label class="form-label">Sugerencias del delegado</label>
        <textarea class="form-control" rows="3" ${ro} oninput="setRecsCampo('sugerencias',this.value)" placeholder="Sugerencias para mejorar la organización del rodeo...">${esc(_recs.sugerencias||'')}</textarea>
    </div>
    <div>
        <label class="form-label">Observaciones generales</label>
        <textarea class="form-control" rows="3" ${ro} oninput="setRecsCampo('observaciones_generales',this.value)" placeholder="Observaciones generales del delegado...">${esc(_recs.observaciones_generales||'')}</textarea>
    </div>`;

    renderReclamosItems(ya);
}

function renderReclamosItems(ya) {
    const cont = document.getElementById('recs-items-cont');
    if (!cont) return;
    if (!_recs.items || _recs.items.length === 0) {
        cont.innerHTML = '<p style="font-size:12px;color:#888;font-style:italic;margin:4px 0 8px;">Sin reclamos registrados.</p>';
        return;
    }
    const dis = ya ? 'disabled' : '';
    const ro  = ya ? 'readonly' : '';
    const optsT = (v) => ['Reglamentario','Conducta','Instalaciones','Organización','Otro'].map(t =>
        `<option value="${t}" ${v===t?'selected':''}>${t}</option>`).join('');

    cont.innerHTML = _recs.items.map(function(r,i){ return `
    <div class="sit-card" style="margin-bottom:10px;">
        <div class="sit-card-hdr">
            Reclamo N° ${i+1}
            ${ya ? '' : `<button class="btn-q" onclick="quitarReclamo(${i})">✕ Eliminar</button>`}
        </div>
        <div class="sit-card-body">
            <div class="campo-form-sm">
                <label>Nombre de quien reclama</label>
                <input type="text" value="${esc(r.nombre||'')}" ${ro} oninput="setReclamoItem(${i},'nombre',this.value)" placeholder="Si se conoce">
            </div>
            <div class="campo-form-sm">
                <label>RUT o N° de socio</label>
                <input type="text" value="${esc(r.rut||'')}" ${ro} oninput="setReclamoItem(${i},'rut',this.value)" placeholder="Si se conoce">
            </div>
            <div class="campo-form-sm">
                <label>Tipo de reclamo</label>
                <select ${dis} onchange="setReclamoItem(${i},'tipo',this.value)"><option value="">—</option>${optsT(r.tipo)}</select>
            </div>
            <div class="campo-form-sm">
                <label>Respuesta entregada</label>
                <input type="text" value="${esc(r.respuesta||'')}" ${ro} oninput="setReclamoItem(${i},'respuesta',this.value)" placeholder="Respuesta al momento">
            </div>
            <div class="campo-form-sm sit-card-full">
                <label>Detalle del reclamo</label>
                <textarea rows="2" ${ro} oninput="setReclamoItem(${i},'detalle',this.value)">${esc(r.detalle||'')}</textarea>
            </div>
            <div class="campo-form-sm sit-card-full">
                <label>Observaciones / Evidencias</label>
                <textarea rows="2" ${ro} oninput="setReclamoItem(${i},'observaciones',this.value)">${esc(r.observaciones||'')}</textarea>
            </div>
        </div>
    </div>`; }).join('');
}

function toggleRecsTabla() {
    const w = document.getElementById('recs-tabla-wrap');
    if (w) w.style.display = _recs.hubo_reclamos === 'si' ? 'block' : 'none';
    renderReclamosItems(_estado === 'enviada');
}

function setRecsCampo(campo, valor) { _recs[campo] = valor; }
function setReclamoItem(idx, campo, valor) { if (_recs.items[idx]) _recs.items[idx][campo] = valor; }

function agregarReclamo() {
    _recs.items.push({ nombre:'', rut:'', tipo:'', detalle:'', respuesta:'', observaciones:'' });
    renderReclamosItems(false);
}

function quitarReclamo(idx) {
    if (!confirm('¿Eliminar este reclamo?')) return;
    _recs.items.splice(idx, 1);
    renderReclamosItems(false);
}

// ═════════════════════════════════════════════════════════════════════════════
// ADJUNTOS DE LA CARTILLA (ETAPA 4) — reutiliza rodeo_adjuntos + /api/usuario/adjuntos
// ═════════════════════════════════════════════════════════════════════════════

function renderSeccionAdjuntos(ya) {
    const cont = document.getElementById('sec-adjuntos-cd');
    if (!cont) return;
    cont.innerHTML = `
    <p style="font-size:13px;color:#555;margin:0 0 10px;">Adjunte documentos, fotos u otros respaldos relacionados con esta cartilla.</p>
    <p style="font-size:12px;color:#888;margin:0 0 12px;">Tipos permitidos: PDF, Word, JPG, PNG, WebP — máximo 20 MB por archivo.</p>
    ${!ya ? `
    <div style="padding:12px 14px;background:#f7f9fc;border:1px solid #e0e8f5;border-radius:8px;margin-bottom:14px;">
        <div class="campo-grid" style="margin-bottom:10px;">
            <div>
                <label class="form-label">Archivo</label>
                <input type="file" id="adj-cd-file" class="form-control" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.webp">
            </div>
            <div>
                <label class="form-label">Descripción (opcional)</label>
                <input type="text" id="adj-cd-desc" class="form-control" placeholder="Ej: Informe disciplinario firmado">
            </div>
        </div>
        <button class="btn btn-secundario btn-pequeño" onclick="subirAdjuntoCd()">Subir adjunto</button>
        <span id="adj-cd-subiendo" style="display:none;font-size:12px;color:#555;margin-left:10px;">Subiendo...</span>
    </div>` : ''}
    <div id="adj-cd-lista"><p style="font-size:13px;color:#888;font-style:italic;">Cargando adjuntos...</p></div>`;
    cargarAdjuntosCd();
}

async function cargarAdjuntosCd() {
    const cont = document.getElementById('adj-cd-lista');
    if (!cont) return;
    try {
        const lista = await api.get(`/usuario/adjuntos?rodeo_id=${RODEO_ID}`);
        const propios = (lista || []).filter(function(a){ return a.tipo_adjunto === 'cartilla_delegado'; });
        if (propios.length === 0) {
            cont.innerHTML = '<p style="font-size:13px;color:#888;font-style:italic;">Sin adjuntos subidos aún.</p>';
            return;
        }
        const ya = ['enviada', 'reenviada', 'aprobada'].includes(_estado);
        cont.innerHTML = '<div style="border:1px solid #e0e8f5;border-radius:6px;padding:0 12px;">' +
            propios.map(function(a) {
                const ico = a.mime_type && a.mime_type.startsWith('image/') ? '🖼️' : '📄';
                const tam = a.tamano_bytes ? (a.tamano_bytes / 1024).toFixed(0) + ' KB' : '';
                return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0f0f0;flex-wrap:wrap;">
                    <span style="font-size:20px;">${ico}</span>
                    <div style="flex:1;min-width:100px;">
                        <div style="font-size:13px;font-weight:600;">${sanitizar(a.nombre_archivo)}</div>
                        ${tam ? `<div style="font-size:11px;color:#888;">${tam}</div>` : ''}
                    </div>
                    <button class="btn btn-pequeño btn-outline" onclick="verAdjuntoCd('${a.id}')">Ver / Descargar</button>
                    ${!ya ? `<button class="btn btn-pequeño" style="background:#fdecea;color:#c0392b;border:1px solid #f5c6cb;" onclick="eliminarAdjuntoCd('${a.id}')">Eliminar</button>` : ''}
                </div>`;
            }).join('') + '</div>';
    } catch(e) {
        const es403 = e.status === 403 || (e.message && e.message.includes('Sin asignación'));
        cont.innerHTML = es403
            ? '<p style="font-size:13px;color:#888;font-style:italic;">No se pueden cargar adjuntos para esta cartilla.</p>'
            : `<p style="font-size:13px;color:#c0392b;">Error al cargar adjuntos: ${sanitizar(e.message)}</p>`;
    }
}

async function subirAdjuntoCd() {
    const fileInput = document.getElementById('adj-cd-file');
    const descInput = document.getElementById('adj-cd-desc');
    const spn       = document.getElementById('adj-cd-subiendo');
    if (!fileInput || !fileInput.files || !fileInput.files[0]) {
        mostrarToast('Seleccione un archivo primero', 'advertencia');
        return;
    }
    if (!_cartillaId) {
        mostrarToast('Guarde el borrador primero antes de adjuntar archivos', 'advertencia');
        return;
    }
    const fd = new FormData();
    fd.append('archivo',      fileInput.files[0]);
    fd.append('rodeo_id',     RODEO_ID);
    fd.append('tipo_adjunto', 'cartilla_delegado');
    if (descInput && descInput.value.trim()) fd.append('descripcion', descInput.value.trim());

    if (spn) spn.style.display = 'inline';
    try {
        await api.upload('/usuario/adjuntos', fd);
        mostrarToast('Archivo subido correctamente', 'exito');
        fileInput.value = '';
        if (descInput) descInput.value = '';
        cargarAdjuntosCd();
    } catch(e) {
        mostrarToast(e.message || 'Error al subir archivo', 'error');
    } finally {
        if (spn) spn.style.display = 'none';
    }
}

async function verAdjuntoCd(id) {
    try {
        const r = await api.get(`/usuario/adjuntos/${id}/url`);
        window.open(r.url, '_blank');
    } catch(e) {
        mostrarToast(e.message || 'Error al obtener URL', 'error');
    }
}

async function eliminarAdjuntoCd(id) {
    if (!confirm('¿Eliminar este adjunto? Esta acción no se puede deshacer.')) return;
    try {
        await api.delete(`/usuario/adjuntos/${id}`);
        mostrarToast('Adjunto eliminado', 'exito');
        cargarAdjuntosCd();
    } catch(e) {
        mostrarToast(e.message || 'Error al eliminar', 'error');
    }
}

// ═════════════════════════════════════════════════════════════════════════════
// RECOLECTAR DATOS (ETAPA 1 + 2 + 3)
// ═════════════════════════════════════════════════════════════════════════════
function recolectarDatos() {
    const radio = (name) => {
        const sel = document.querySelector(`input[name="${name}"]:checked`);
        if (!sel) return null;
        return sel.value === 'si';
    };
    const respuestasActualizadas = Object.assign({}, _respuestasJson, {
        ganado_series:        _seriesGanado,
        desempeno_jurado:     _dj,
        disciplina_informe:   _disc,
        recinto_deportivo:    _recinto,
        colleras_invitadas:   _col,
        reemplazo_jinetes:    _ree,
        accidentes_informe:   _acc,
        informe_accidentes_general: _accGeneral,
        bienestar_animal:     _ba,
        informe_veterinario:  _vet,
        comentarios_generales:      _com,
        antecedentes_disciplinarios: _ant,
        reclamos_sugerencias: _recs
    });
    return {
        // Temporada / Fecha del Rodeo / Tipo de Rodeo / Club-Asociación
        // (campo manual antiguo): ya NO se envían — son automáticos/en vivo
        // desde `rodeo` (4ª y 5ª revisión), no hay input en el DOM que leer.
        delegado_nombre:                     document.getElementById('f-delegado_nombre')?.value.trim() || null,
        delegado_telefono:                   document.getElementById('f-delegado_telefono')?.value.trim() || null,
        secretario_jurado:                   document.getElementById('f-secretario_jurado')?.value.trim() || null,
        secretario_numero_socio:             document.getElementById('f-secretario_numero_socio')?.value.trim() || null,
        publico_serie_campeones:             document.getElementById('f-publico_serie_campeones')?.value ? parseInt(document.getElementById('f-publico_serie_campeones').value) : null,
        serie_campeones_dos_vueltas:         radio('serie_campeones_dos_vueltas'),
        incluye_informe_disciplinario:       radio('incluye_informe_disciplinario'),
        incluye_informe_ganado_bajo_peso:    radio('incluye_informe_ganado_bajo_peso'),
        certificacion_medialuna_comuna:      document.getElementById('f-cert_medialuna')?.checked   ?? false,
        certificacion_mas_200_personas:      document.getElementById('f-cert_200')?.checked         ?? false,
        certificacion_mas_250_personas:      document.getElementById('f-cert_250')?.checked         ?? false,
        certificacion_vinculacion_comunidad: document.getElementById('f-cert_vinculacion')?.checked ?? false,
        respuestas_json: respuestasActualizadas
    };
}

// ═════════════════════════════════════════════════════════════════════════════
// GUARDAR BORRADOR
// ═════════════════════════════════════════════════════════════════════════════
async function guardarBorrador() {
    if (_guardando) return;
    _guardando = true;
    const btn = document.getElementById('btn-borrador');
    if (btn) { btn.disabled = true; btn.textContent = 'Guardando…'; }
    try {
        const datos = recolectarDatos();
        if (!_cartillaId) {
            const r = await api.post(`/usuario/cartilla-delegado/rodeo/${RODEO_ID}`, {});
            _cartillaId = r.cartilla.id;
        }
        await api.patch(`/usuario/cartilla-delegado/${_cartillaId}`, datos);
        _respuestasJson = datos.respuestas_json;
        mostrarToast('Borrador guardado correctamente', 'exito');
    } catch (err) {
        mostrarToast(err.message || 'Error al guardar', 'error');
    } finally {
        _guardando = false;
        if (btn) { btn.disabled = false; btn.textContent = 'Guardar borrador'; }
    }
}

// ═════════════════════════════════════════════════════════════════════════════
// ENVIAR CARTILLA
// ═════════════════════════════════════════════════════════════════════════════
async function enviarCartilla() {
    if (_guardando) return;

    const datos = recolectarDatos();

    // Campos obligatorios sección I — Temporada/Fecha del Rodeo/Tipo de
    // Rodeo ya no se piden acá: son automáticos en vivo desde `rodeo` (4ª y
    // 5ª revisión); se validan directamente contra `_rodeoActual`, no
    // contra `datos`.
    const requeridos = {
        delegado_nombre:  'Delegado Oficial'
    };
    const faltantes = Object.entries(requeridos)
        .filter(([k]) => !datos[k] || String(datos[k]).trim() === '')
        .map(([, label]) => label);

    if (!(_rodeoActual?.temporadas?.nombre || _rodeoActual?.fecha)) {
        faltantes.push('Temporada (revise que el Rodeo tenga temporada asignada)');
    }
    if (!_rodeoActual?.fecha) {
        faltantes.push('Fecha del Rodeo (revise el Rodeo en Administración)');
    }
    if (!_rodeoActual?.tipo_rodeo_nombre) {
        faltantes.push('Tipo de Rodeo (revise el Rodeo en Administración)');
    }

    if (faltantes.length > 0) {
        mostrarToast('Complete los campos obligatorios: ' + faltantes.join(', '), 'advertencia');
        return;
    }

    // Validación ganado: series sin nombre
    const seriesSinNombre = _seriesGanado.filter(s => !s.nombre || !s.nombre.trim());
    if (seriesSinNombre.length > 0) {
        mostrarToast('Todas las series de ganado deben tener nombre antes de enviar.', 'advertencia');
        return;
    }

    // Validación Sección III — desempeño del jurado: cada aspecto presente
    // debe estar entre 1.0 y 7.0 (misma validación que hace el backend).
    const aspectosFueraDeRango = ASPECTOS_DESEMPENO_UI.filter(a => {
        const v = _dj[a.key];
        if (v === null || v === undefined || v === '') return false;
        const n = Number(v);
        return isNaN(n) || n < 1 || n > 7;
    });
    if (aspectosFueraDeRango.length > 0) {
        mostrarToast('Las notas del desempeño del jurado deben estar entre 1,0 y 7,0.', 'advertencia');
        return;
    }

    // Validación ETAPA 3 — disciplina
    if (_disc.hubo_informe === 'si' && (!_disc.situaciones || _disc.situaciones.length === 0)) {
        mostrarToast('Ha indicado que hubo informe de disciplina. Debe agregar al menos una situación disciplinaria.', 'advertencia');
        return;
    }

    // Validación ETAPA 3 — reemplazo de jinetes
    if (_ree.hubo === 'si' && (!_ree.items || _ree.items.length === 0)) {
        mostrarToast('Ha indicado que hubo reemplazo de jinetes. Debe agregar al menos un registro.', 'advertencia');
        return;
    }

    // Validaciones ETAPA 4 — accidentes
    if (_acc.hubo_accidentes === 'si' && (!_acc.items || _acc.items.length === 0) && !(_acc.observaciones_generales || '').trim()) {
        mostrarToast('Ha indicado que hubo accidentes. Agregue al menos un accidente o complete el campo de observaciones generales.', 'advertencia');
        return;
    }
    const accConCentroSinNombre = (_acc.items || []).some(function(a){ return a.derivado === 'si' && !a.centro_asistencial && !a.observaciones; });
    if (accConCentroSinNombre) {
        mostrarToast('Hay accidentes derivados a centro asistencial sin nombre del centro ni observaciones. Complete esa información.', 'advertencia');
        return;
    }

    // Validaciones ETAPA 4 — bienestar animal
    if ((_ba.hubo_lesiones_equinos === 'si' || _ba.hubo_lesiones_bovinos === 'si') && !(_ba.detalle_lesiones || '').trim() && !(_ba.observaciones || '').trim()) {
        mostrarToast('Ha indicado lesiones en animales. Ingrese el detalle o las observaciones de bienestar animal.', 'advertencia');
        return;
    }

    // Validaciones ETAPA 4 — veterinario
    if (_vet.preparacion === 'tecnico' && !(_vet.especifica_tecnico || '').trim()) {
        mostrarToast('Ha seleccionado "Técnico" en preparación del veterinario. Especifique el tipo de técnico.', 'advertencia');
        return;
    }
    if (_vet.preparacion === 'otro' && !(_vet.especifica_otro || '').trim()) {
        mostrarToast('Ha seleccionado "Otro" en preparación del veterinario. Especifique el tipo de personal.', 'advertencia');
        return;
    }

    // Validaciones ETAPA 4 — reclamos
    if (_recs.hubo_reclamos === 'si' && (!_recs.items || _recs.items.length === 0)) {
        mostrarToast('Ha indicado que hubo reclamos. Agregue al menos un reclamo registrado.', 'advertencia');
        return;
    }

    // Avisos (confirm, no bloquean)
    const sumBaj = _seriesGanado.reduce((acc, s) => acc + numPos(s.fp_baj), 0);
    const sumSob = _seriesGanado.reduce((acc, s) => acc + numPos(s.fp_sob), 0);
    if ((sumBaj > 0 || sumSob > 0) && datos.incluye_informe_ganado_bajo_peso !== true) {
        if (!confirm('Ha ingresado ganado bajo/sobre peso pero no marcó "Sí" en "¿Incluye informe de ganado bajo peso?". ¿Desea continuar de todas formas?')) return;
    }

    const esReenvio = _estado === 'observada';
    const confirmMsg = esReenvio
        ? '¿Confirma el reenvío del Informe del Delegado?\n\nEl informe volverá a revisión del Administrador.'
        : '¿Confirma el envío del Informe del Delegado?\n\nUna vez enviado no podrá editarlo sin autorización del Administrador.';
    if (!confirm(confirmMsg)) return;

    _guardando = true;
    const btn = document.getElementById('btn-enviar');
    if (btn) { btn.disabled = true; btn.textContent = esReenvio ? 'Reenviando…' : 'Enviando…'; }
    try {
        if (!_cartillaId) {
            const r = await api.post(`/usuario/cartilla-delegado/rodeo/${RODEO_ID}`, {});
            _cartillaId = r.cartilla.id;
        }
        await api.post(`/usuario/cartilla-delegado/${_cartillaId}/enviar`, datos);
        mostrarToast(esReenvio ? 'Informe reenviado correctamente' : 'Informe enviado correctamente', 'exito');
        setTimeout(() => init(), 1200);
    } catch (err) {
        mostrarToast(err.message || 'Error al enviar', 'error');
        _guardando = false;
        if (btn) { btn.disabled = false; btn.textContent = esReenvio ? 'Reenviar informe' : 'Enviar informe'; }
    }
}
</script>
