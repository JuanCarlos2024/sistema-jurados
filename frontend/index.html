<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Sistema de Jurados</title>
    <link rel="icon" type="image/png" href="/assets/logo_V2.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="login-page">
    <div class="login-card">
        <div class="login-logo">
            <img src="/assets/logo_V2.png" alt="Federación del Rodeo Chileno" style="width:140px; height:140px; object-fit:contain; margin-bottom:12px;">
            <h1>Sistema de Jurados</h1>
            <p>Federación del Rodeo Chileno</p>
        </div>

        <!-- Pestañas -->
        <div class="login-tabs">
            <button class="login-tab activo" id="tab-admin" onclick="mostrarTab('admin')">
                Administrador
            </button>
            <button class="login-tab" id="tab-usuario" onclick="mostrarTab('usuario')">
                Jurado / Delegado
            </button>
            <button class="login-tab" id="tab-institucional" onclick="mostrarTab('institucional')">
                Delegado de Asociación
            </button>
            <button class="login-tab" id="tab-comision" onclick="mostrarTab('comision')">
                Comisión de Asociación
            </button>
        </div>

        <!-- Formulario Admin -->
        <form id="form-admin" onsubmit="loginAdmin(event)">
            <div class="form-grupo">
                <label class="form-label">Correo electrónico</label>
                <input type="email" id="admin-email" class="form-control"
                       placeholder="admin@federacion.cl" required autocomplete="email">
            </div>
            <div class="form-grupo">
                <label class="form-label">Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="admin-password" class="form-control"
                           placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="password-toggle" id="admin-password-toggle"
                            aria-label="Mostrar contraseña"
                            onclick="togglePasswordVisibility('admin-password', this)">
                        <svg class="icono-ojo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <svg class="icono-ojo-tachado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                    </button>
                </div>
            </div>
            <div id="admin-error" class="alerta alerta-error oculto" style="margin-bottom:14px;"></div>
            <button type="submit" class="btn btn-primario w-100" id="btn-admin-login">
                Iniciar Sesión
            </button>
        </form>

        <!-- Formulario Usuario Pagado -->
        <form id="form-usuario" class="oculto" onsubmit="loginUsuario(event)">
            <div class="alerta alerta-info" style="margin-bottom:16px; font-size:13px;">
                <div>
                    <strong>Primer ingreso:</strong> use su código <strong>USR-XXXX</strong><br>
                    <strong>Siguientes ingresos:</strong> use su RUT (ej: 12345678-9)
                </div>
            </div>
            <div class="form-grupo">
                <label class="form-label">Código o RUT</label>
                <input type="text" id="usr-identificador" class="form-control"
                       placeholder="USR-0001 o 12345678-9" required autocomplete="username">
                <div class="form-hint">Sin puntos, con guión</div>
            </div>
            <div class="form-grupo">
                <label class="form-label">Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="usr-password" class="form-control"
                           placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="password-toggle" id="usr-password-toggle"
                            aria-label="Mostrar contraseña"
                            onclick="togglePasswordVisibility('usr-password', this)">
                        <svg class="icono-ojo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <svg class="icono-ojo-tachado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                    </button>
                </div>
                <div class="form-hint">Contraseña inicial: <strong>jurados</strong></div>
            </div>
            <div id="usr-error" class="alerta alerta-error oculto" style="margin-bottom:14px;"></div>
            <button type="submit" class="btn btn-primario w-100" id="btn-usr-login">
                Iniciar Sesión
            </button>
        </form>

        <!-- Formulario Cuenta Institucional (Delegado de Asociación) -->
        <form id="form-institucional" class="oculto" onsubmit="loginInstitucional(event)">
            <div class="form-grupo">
                <label class="form-label">Correo institucional</label>
                <input type="email" id="inst-email" class="form-control"
                       placeholder="delegado-osorno@ferochi.com" required autocomplete="username">
            </div>
            <div class="form-grupo">
                <label class="form-label">Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="inst-password" class="form-control"
                           placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="password-toggle" id="inst-password-toggle"
                            aria-label="Mostrar contraseña"
                            onclick="togglePasswordVisibility('inst-password', this)">
                        <svg class="icono-ojo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <svg class="icono-ojo-tachado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                    </button>
                </div>
            </div>
            <div id="inst-error" class="alerta alerta-error oculto" style="margin-bottom:14px;"></div>
            <button type="submit" class="btn btn-primario w-100" id="btn-inst-login">
                Iniciar Sesión
            </button>
        </form>

        <!-- Formulario Cuenta Institucional (Comisión de Asociación) -->
        <form id="form-comision" class="oculto" onsubmit="loginComision(event)">
            <div class="form-grupo">
                <label class="form-label">Correo institucional</label>
                <input type="email" id="comis-email" class="form-control"
                       placeholder="comision-osorno@ferochi.cl" required autocomplete="username">
            </div>
            <div class="form-grupo">
                <label class="form-label">Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="comis-password" class="form-control"
                           placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="password-toggle" id="comis-password-toggle"
                            aria-label="Mostrar contraseña"
                            onclick="togglePasswordVisibility('comis-password', this)">
                        <svg class="icono-ojo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <svg class="icono-ojo-tachado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                    </button>
                </div>
            </div>
            <div id="comis-error" class="alerta alerta-error oculto" style="margin-bottom:14px;"></div>
            <button type="submit" class="btn btn-primario w-100" id="btn-comis-login">
                Iniciar Sesión
            </button>
        </form>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/login-ux.js"></script>
<script>
    // Si ya está logueado, redirigir
    (function() {
        const token = localStorage.getItem('token');
        const usuario = localStorage.getItem('usuario');
        if (token && usuario) {
            const u = JSON.parse(usuario);
            if (u.tipo === 'administrador') {
                if (u.rol_evaluacion === 'analista' || u.rol_evaluacion === 'comision_tecnica') window.location.href = '/admin/evaluaciones.html';
                else if (u.rol_evaluacion === 'capacitador') window.location.href = '/admin/capacitaciones.html';
                else window.location.href = '/admin/dashboard.html';
            } else if (u.tipo === 'cuenta_institucional') {
                // Comisión de Asociación (079): perfil institucional nuevo,
                // independiente del Delegado — redirección propia por rol_institucional.
                if (u.rol_institucional === 'comision_asociacion') {
                    window.location.href = '/institucional/comision/rodeos.html';
                } else {
                    // Fase 3.3: entra directo a Mis Rodeos, sin pasar por Mi Panel (eliminado).
                    window.location.href = '/institucional/rodeos.html';
                }
            } else {
                window.location.href = '/usuario/dashboard.html';
            }
        }
    })();

    // Mostrar/ocultar contraseña — botón tipo "button": nunca envía el
    // formulario ni borra el valor del campo, solo alterna su `type`.
    function togglePasswordVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        const mostrando = input.type === 'password';
        input.type = mostrando ? 'text' : 'password';
        btn.classList.toggle('mostrando', mostrando);
        btn.setAttribute('aria-label', mostrando ? 'Ocultar contraseña' : 'Mostrar contraseña');
    }

    function mostrarTab(tab) {
        document.getElementById('form-admin').classList.toggle('oculto', tab !== 'admin');
        document.getElementById('form-usuario').classList.toggle('oculto', tab !== 'usuario');
        document.getElementById('form-institucional').classList.toggle('oculto', tab !== 'institucional');
        document.getElementById('form-comision').classList.toggle('oculto', tab !== 'comision');
        document.getElementById('tab-admin').classList.toggle('activo', tab === 'admin');
        document.getElementById('tab-usuario').classList.toggle('activo', tab === 'usuario');
        document.getElementById('tab-institucional').classList.toggle('activo', tab === 'institucional');
        document.getElementById('tab-comision').classList.toggle('activo', tab === 'comision');
    }

    // ── Helper: fetch con signal para los handlers de login ──────────────────
    function makeFetchLogin(endpoint) {
        return async function(credentials, signal) {
            const resp = await fetch('/api' + endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(credentials),
                signal: signal,
            });
            const data = await resp.json().catch(function() { return null; });
            if (!resp.ok) {
                const err = new Error(data && data.error ? data.error : 'Error al iniciar sesión');
                err.status = resp.status;
                throw err;
            }
            return data;
        };
    }

    // ── Helper: aplicar estado al par botón / div de error ───────────────────
    function makeStateHandler(btnId, errId) {
        return function(state) {
            const btn = document.getElementById(btnId);
            const div = document.getElementById(errId);
            btn.disabled = state.loading;
            btn.textContent = state.text;
            if (state.message) {
                div.textContent = state.message;
                div.className = 'alerta alerta-' + (state.messageType || 'error');
                div.classList.remove('oculto');
            } else {
                div.className = 'alerta alerta-error oculto';
            }
        };
    }

    // ── Handler: login de Administrador ──────────────────────────────────────
    const adminLoginHandler = LoginUX.createLoginHandler({
        apiFetch: makeFetchLogin('/auth/admin/login'),
        onStateChange: makeStateHandler('btn-admin-login', 'admin-error'),
        onSuccess: function(data) {
            api.guardarSesion(data.token, data.usuario);
            if (data.usuario.rol_evaluacion === 'analista' || data.usuario.rol_evaluacion === 'comision_tecnica') {
                window.location.href = '/admin/evaluaciones.html';
            } else if (data.usuario.rol_evaluacion === 'capacitador') {
                window.location.href = '/admin/capacitaciones.html';
            } else {
                window.location.href = '/admin/dashboard.html';
            }
        },
    });

    async function loginAdmin(e) {
        e.preventDefault();
        if (document.getElementById('btn-admin-login').disabled) return;
        await adminLoginHandler.login({
            email:    document.getElementById('admin-email').value.trim(),
            password: document.getElementById('admin-password').value,
        });
    }

    // ── Handler: login de Jurado / Delegado ───────────────────────────────────
    const usuarioLoginHandler = LoginUX.createLoginHandler({
        apiFetch: makeFetchLogin('/auth/usuario/login'),
        onStateChange: makeStateHandler('btn-usr-login', 'usr-error'),
        onSuccess: function(data) {
            api.guardarSesion(data.token, data.usuario);
            if (data.usuario.primer_login) {
                window.location.href = '/usuario/perfil.html?primer_login=1';
            } else {
                window.location.href = '/usuario/dashboard.html';
            }
        },
    });

    async function loginUsuario(e) {
        e.preventDefault();
        if (document.getElementById('btn-usr-login').disabled) return;
        await usuarioLoginHandler.login({
            identificador: document.getElementById('usr-identificador').value.trim(),
            password:      document.getElementById('usr-password').value,
        });
    }

    // ── Handler: login de Cuenta Institucional (Delegado de Asociación) ──────
    const institucionalLoginHandler = LoginUX.createLoginHandler({
        apiFetch: makeFetchLogin('/institucional/auth/login'),
        onStateChange: makeStateHandler('btn-inst-login', 'inst-error'),
        onSuccess: function(data) {
            api.guardarSesion(data.token, data.usuario);
            if (data.usuario.primer_login) {
                window.location.href = '/institucional/perfil.html?primer_login=1';
            } else {
                // Fase 3.3: entra directo a Mis Rodeos, sin pasar por Mi Panel (eliminado).
                window.location.href = '/institucional/rodeos.html';
            }
        },
    });

    async function loginInstitucional(e) {
        e.preventDefault();
        if (document.getElementById('btn-inst-login').disabled) return;
        await institucionalLoginHandler.login({
            email:    document.getElementById('inst-email').value.trim(),
            password: document.getElementById('inst-password').value,
        });
    }

    // ── Handler: login de Cuenta Institucional (Comisión de Asociación) ─────
    // Mismo endpoint que Delegado de Asociación (una sola tabla de cuentas,
    // migración 079) — la redirección se decide por rol_institucional, nunca
    // por cuál pestaña se usó para entrar.
    const comisionLoginHandler = LoginUX.createLoginHandler({
        apiFetch: makeFetchLogin('/institucional/auth/login'),
        onStateChange: makeStateHandler('btn-comis-login', 'comis-error'),
        onSuccess: function(data) {
            api.guardarSesion(data.token, data.usuario);
            if (data.usuario.primer_login) {
                window.location.href = '/institucional/perfil.html?primer_login=1';
            } else {
                window.location.href = '/institucional/comision/rodeos.html';
            }
        },
    });

    async function loginComision(e) {
        e.preventDefault();
        if (document.getElementById('btn-comis-login').disabled) return;
        await comisionLoginHandler.login({
            email:    document.getElementById('comis-email').value.trim(),
            password: document.getElementById('comis-password').value,
        });
    }
</script>
</body>
</html>
